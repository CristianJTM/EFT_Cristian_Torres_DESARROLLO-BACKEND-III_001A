spring.application.name=bff-web
server.port=8082

# ========================================
# OpenFeign - Account Service
# ========================================
spring.cloud.openfeign.client.config.account-service.connectTimeout=2000
spring.cloud.openfeign.client.config.account-service.readTimeout=5000

# ========================================
# OpenFeign - Account Management Service
# ========================================
spring.cloud.openfeign.client.config.account-management-service.connectTimeout=2000
spring.cloud.openfeign.client.config.account-management-service.readTimeout=5000

# ========================================
# Eureka Discovery
# ========================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ========================================
# Resilience4j - Account Service Circuit Breaker
# ========================================
resilience4j.circuitbreaker.instances.accountService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.accountService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.accountService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.accountService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.accountService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.accountService.automaticTransitionFromOpenToHalfOpenEnabled=true

# ========================================
# Resilience4j - Account Service Retry
# ========================================
resilience4j.retry.instances.accountService.maxAttempts=3
resilience4j.retry.instances.accountService.waitDuration=1s
resilience4j.retry.instances.accountService.enableExponentialBackoff=true
resilience4j.retry.instances.accountService.exponentialBackoffMultiplier=2

# ========================================
# Resilience4j - Account Management Circuit Breaker
# ========================================
resilience4j.circuitbreaker.instances.accountManagement.slidingWindowSize=10
resilience4j.circuitbreaker.instances.accountManagement.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.accountManagement.failureRateThreshold=50
resilience4j.circuitbreaker.instances.accountManagement.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.accountManagement.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.accountManagement.automaticTransitionFromOpenToHalfOpenEnabled=true

# ========================================
# Actuator
# ========================================
management.endpoints.web.exposure.include=health,info,metrics,mappings
management.endpoint.health.show-details=always

# ========================================
# OAuth2 Resource Server
# ========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_SERVER_URL:http://localhost:9000}