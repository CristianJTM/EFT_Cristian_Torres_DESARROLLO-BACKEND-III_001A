spring.application.name=bff-atm

server.port=8084

# ========================================
# OpenFeign - Account Service
# ========================================

spring.cloud.openfeign.client.config.account-service.connectTimeout=2000
spring.cloud.openfeign.client.config.account-service.readTimeout=5000

# ========================================
# OpenFeign - Payment Service
# ========================================

spring.cloud.openfeign.client.config.payment-service.connectTimeout=2000
spring.cloud.openfeign.client.config.payment-service.readTimeout=5000

# ========================================
# Eureka Discovery
# ========================================

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ========================================
# Resilience4j - Circuit Breaker: Account Service
# ========================================

resilience4j.circuitbreaker.instances.accountService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.accountService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.accountService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.accountService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.accountService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.accountService.automaticTransitionFromOpenToHalfOpenEnabled=true

# ========================================
# Resilience4j - Retry: Account Service
# ========================================

resilience4j.retry.instances.accountService.maxAttempts=3
resilience4j.retry.instances.accountService.waitDuration=1s
resilience4j.retry.instances.accountService.enableExponentialBackoff=true
resilience4j.retry.instances.accountService.exponentialBackoffMultiplier=2

# ========================================
# Resilience4j - Circuit Breaker: Payment Service
# ========================================

resilience4j.circuitbreaker.instances.paymentService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.paymentService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.paymentService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.paymentService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.paymentService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.paymentService.automaticTransitionFromOpenToHalfOpenEnabled=true

# ========================================
# Resilience4j - Retry: Payment Service
# ========================================

resilience4j.retry.instances.paymentService.maxAttempts=1
resilience4j.retry.instances.paymentService.waitDuration=1s

# ========================================
# Actuator
# ========================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ========================================
# OAuth2 Resource Server
# ========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_SERVER_URL:http://localhost:9000}